baseURL: "https://phant0um.github.io/"
title: "phant0um"
locale: "pt-br"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
pagination:
  pagerSize: 10

# Necessário para a busca (index JSON)
outputs:
  home:
    - HTML
    - RSS
    - JSON

minify:
  disableXML: true
  minifyOutput: true

markup:
  goldmark:
    renderer:
      unsafe: true # permite HTML inline dentro do Markdown
  highlight:
    noClasses: false # usa CSS classes -> respeita dark mode do tema
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: "github-dark"
  tableOfContents:
    startLevel: 2
    endLevel: 4

params:
  env: production # habilita Google Analytics/OpenGraph/Twitter cards
  description: "Artigos técnicos sobre agentes, LLMs e engenharia de sistemas."
  keywords: [blog, ai, agents, llm, engineering]
  author: "Michel"
  # Card padrão para home, /posts/ e /tags/ — páginas sem `cover` própria.
  # Post individual sobrescreve com a imagem do próprio título.
  images: ["og/default.png"]
  DateFormat: "2 January 2006"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: true
  disableScrollToTop: false
  hidemeta: false
  hideSummary: false
  comments: false

  # Content é renderizado com markdownify pelo PaperMod, então links funcionam.
  # A lista abaixo existe porque a home ordena do mais novo para o mais antigo,
  # e a série se lê no sentido contrário. Sem isto o leitor entra pelo fim.
  homeInfoParams:
    Title: "phant0um"
    Content: |
      Artigos técnicos longos — o que não cabe numa thread.
      Agentes, LLMs, engenharia de sistemas e as decisões por trás deles.

      **Série 1 — verde que mente.** Cinco casos em que um sistema meu declarou
      estar verificado e não estava, mais a régua que tentei extrair deles. Cada
      um se sustenta sozinho; nesta ordem eles se apoiam:

      1. [A suíte que provou a si mesma](/posts/false-green-cobertura/) — cobertura derivada do exit code
      2. [O relógio de revisão que nunca disparava](/posts/relogio-de-revisao/) — `updated` no lugar de `reviewed`
      3. [CLAUDE.md é firmware](/posts/claude-md-e-firmware/) — instrução sempre-carregada é imposto
      4. [A auditoria que falhou antes de passar](/posts/auditoria-descartada/) — o que fazer quando o resultado está contaminado
      5. [O conversor que vazava títulos privados](/posts/gate-de-privacidade-wikilink/) — default fechado como controle de acesso
      6. [Quando seis canários, quando um hook, quando nada](/posts/limiar-de-verificacao/) — quanta verificação cada mudança merece

  socialIcons:
    - name: github
      url: "https://github.com/phant0um"
    - name: rss
      url: "index.xml"

  assets:
    disableHLJS: true # highlight é feito pelo Hugo (Chroma), não no browser
    favicon: "/favicon.ico"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    threshold: 0.4
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Artigos
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: search
      name: Buscar
      url: /search/
      weight: 30
    - identifier: about
      name: Sobre
      url: /about/
      weight: 40
